name: Select Monthly Honor Board Winners

on:
  schedule:
    # Run at 00:05 on the 1st of every month
    - cron: '5 0 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  select-winners:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: |
          cd functions
          npm install
      
      - name: Select monthly winners
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          cd functions
          node scripts/select-winners.js
